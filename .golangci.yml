version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly
  relative-path-mode: gomod
  go: "1.26.7"

linters:
  default: none
  enable:
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    staticcheck:
      checks:
        - all
        - "-S1016"
        - "-ST1000"
        - "-ST1003"
        - "-ST1016"
        - "-ST1020"
        - "-ST1021"
        - "-ST1022"
    govet:
      enable:
        - copylocks
        - nilness
        - sortslice
        - unusedwrite
  exclusions:
    generated: strict
    warn-unused: true
    paths:
      - ^gen/

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
