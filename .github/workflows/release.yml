name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Release notes from CHANGELOG
        run: |
          chmod +x scripts/release-notes.sh
          ./scripts/release-notes.sh "${GITHUB_REF_NAME}" > /tmp/release-notes.md
      - name: Drop stale release for this tag (re-run only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # New tag (e.g. v0.0.3): no release yet — skip. Same tag re-pushed: remove broken/partial release so goreleaser starts clean. Tag is never deleted.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release delete "${GITHUB_REF_NAME}" --yes --cleanup-tag=false
          fi
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes=/tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
