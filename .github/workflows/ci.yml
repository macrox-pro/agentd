name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Lint
        run: make lint
      - name: Docs parity
        run: make docs-check
      - name: Intent check
        run: make intent-check
      - name: Test
        run: make test
      - name: Integration
        run: go test -tags=integration ./... -race -count=1

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: E2E
        run: make e2e

  platform-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Test platform packages
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            go test ./internal/config/... ./internal/daemon/... ./internal/transport/... -count=1
          else
            go test ./internal/config/... ./internal/daemon/... ./internal/transport/... -race -count=1
          fi
        shell: bash
